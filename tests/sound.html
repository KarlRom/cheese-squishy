<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squishy audio checks</title><style>body{font:16px system-ui;max-width:660px;margin:40px auto;padding:24px;background:#fff;color:#333}button{padding:14px}pre{white-space:pre-wrap;line-height:1.8}</style><h1>Squishy audio checks</h1><p>Press the button to run real Web Audio signal checks. Short squishy sounds will play. Keep this tab active during the check.</p><button id="run">Run audio checks</button><pre id="result" role="status">Ready.</pre><p><a href="../">Return to the squishy</a></p><script type="module">
import { SquishySound } from '../sound.js?v=2.0.0';
const button=document.querySelector('#run'), result=document.querySelector('#result');
button.addEventListener('click',async()=>{
 button.disabled=true;result.textContent='Checking…';
 const sound=new SquishySound();
 const lines=[];
 const check=(condition,label)=>{if(!condition)throw new Error(label);lines.push('PASS: '+label);result.textContent=lines.join('\n');};
 const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 try{
  await sound.unlock();check(sound.supported&&sound.context?.state==='running','gesture starts the audio context');
  const analyser=sound.context.createAnalyser();analyser.fftSize=2048;sound.master.connect(analyser);
  const data=new Float32Array(analyser.fftSize);
  const rms=()=>{analyser.getFloatTimeDomainData(data);return Math.sqrt(data.reduce((sum,v)=>sum+v*v,0)/data.length);};
  const peakOutput=async()=>{let peak=0;for(let i=0;i<7;i++){await wait(30);peak=Math.max(peak,rms());}return peak;};
  await sound.touch('press',.8);
  const contactPeak=await peakOutput();
  check(contactPeak>.0001,'a quick contact makes sticky rubber audio without any animation update');
  await sound.touch('release',.8);
  check(await peakOutput()>.0001,'lifting off creates a separate adhesive peel');
  await wait(350);
  sound.update(1/60,.6);
  const pressing=await peakOutput();check(pressing>.0001,`press produces audio (RMS ${pressing.toFixed(5)})`);
  await wait(200);
  for(let i=0;i<40;i++){sound.drag(650);sound.update(1/60,.3+(i%5)*.12,.4);}
  check(await peakOutput()<.00001,'holding, compression and dragging stay silent between contact events');
  sound.setPreferences(false,.38);await wait(330);
  check(rms()<.00001,'mute silences the actual output');
  await sound.touch('press',.8);await wait(90);
  check(rms()<.00001,'direct contact sounds respect mute');
  sound.setPreferences(true,.38);await sound.touch('press',.8);
  check(await peakOutput()>.0001,'unmute restores soft contact audio');
  sound.update(1/60,0);await wait(600);
  check(rms()<.00001,'release fades back to silence');
  sound.bubble(.8,true);sound.silence();await wait(250);
  check(rms()<.00001&&sound.grains.size===0,'reset stops sticky tails and cleans up their audio sources');
  sound.suspend();await wait(100);
  check(sound.context.state==='suspended','suspending pauses the audio context');
  result.textContent=lines.join('\n')+'\nAll audio checks passed.';
 }catch(error){result.textContent=lines.join('\n')+'\nFAIL: '+error.message;}
 finally{sound.suspend();await sound.context?.close();button.disabled=false;}
});
</script></html>
