<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Tactile 3D cheese and pearl squishies with slow-rise deformation and soft sticky sounds.">
  <title>Cheese squishy</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2.9.0">
</head>
<body data-scene="table">
  <div class="app">
    <button class="settings-toggle icon-button" id="settings-toggle" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="white"/><circle cx="15" cy="17" r="3" fill="white"/></svg></button>
    <button class="put-down icon-button" id="put-down" aria-label="Drop squishy back onto the table" title="Drop onto table" hidden>Drop</button>
    <main aria-label="Cheese squishy">
      <div class="toy-picker" role="group" aria-label="Choose a squishy">
        <button id="toy-cheese" aria-pressed="true" aria-label="Cheese squishy"><span class="toy-swatch cheese-swatch" aria-hidden="true"></span>Cheese</button>
        <button id="toy-pearl" aria-pressed="false" aria-label="Pearl coconut oil squishy"><span class="toy-swatch pearl-swatch" aria-hidden="true"></span>Pearl</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="squishy" tabindex="0" role="img" aria-label="Interactive 3D cheese. Press and hold to dent, drag to stretch, or pinch to squeeze. Drag the white space to turn the view, or choose Rotate and pinch to zoom. Hold Space to squeeze; arrow keys move the press; R resets." aria-describedby="gesture-help"></canvas>
        <span id="hand-cursor-0" class="hand-cursor" hidden aria-hidden="true"></span><span id="hand-cursor-1" class="hand-cursor" hidden aria-hidden="true"></span>
        <div class="hand-panel" id="hand-panel" hidden aria-label="Hand tracking camera">
          <div class="hand-panel-heading"><span>Hand mode</span><button id="stop-hands" aria-label="Stop camera and hand mode">×</button></div>
          <div class="hand-preview"><video id="hand-video" muted playsinline autoplay aria-label="Mirrored camera preview"></video><canvas id="hand-overlay" aria-hidden="true"></canvas></div>
          <p id="hand-message" role="status" aria-live="polite"></p>
        </div>
        <div class="loading" id="loading" role="status" aria-label="Loading"><span aria-hidden="true"></span></div>
        <div class="error" id="error" hidden><strong>WebGL 2 required.</strong><p>Enable hardware acceleration or try another browser.</p></div>
      </div>
      <div class="interaction">
        <button id="pick-up" class="pickup-button">Pick up</button>
        <div class="toolbar">
          <div class="mode-control" role="group" aria-label="Interaction mode"><button id="mode-squish" aria-pressed="true">Squish</button><button id="mode-rotate" aria-pressed="false">Rotate</button></div>
          <button id="squeeze" class="primary" aria-label="Squeeze the cheese" title="Try a different squeeze">Squeeze</button>
          <button id="reset" class="icon-button" aria-label="Reset cheese and view" title="Reset (R)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
        </div>
        <div class="view-buttons" id="view-buttons" role="group" aria-label="Rotate and zoom without gestures" hidden><button id="view-left" aria-label="Rotate left">←</button><button id="view-right" aria-label="Rotate right">→</button><button id="view-up" aria-label="View from above">↑</button><button id="view-down" aria-label="View from below">↓</button><button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button><button id="view-home" aria-label="Reset view" title="Reset view">↺</button></div>
        <p id="gesture-help" class="sr-only">Press and hold, drag to stretch, or pinch to squeeze.</p>
        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
      </div>
      <aside class="settings" id="settings" aria-label="Settings" hidden>
        <div class="settings-heading"><span>Settings</span><button class="icon-button" id="close-settings" aria-label="Close settings">×</button></div>
        <label for="resistance">Resistance <output id="resistance-value" for="resistance">Soft</output></label>
        <input id="resistance" type="range" min="0" max="100" value="32" aria-describedby="resistance-hint">
        <span class="sr-only" id="resistance-hint">Melty to firm.</span>
        <label for="recovery">Recovery <output id="recovery-value" for="recovery">Very slow</output></label>
        <input id="recovery" type="range" min="0" max="100" value="25" aria-describedby="recovery-hint">
        <span class="sr-only" id="recovery-hint">Almost still to slow rise.</span>
        <div class="sound-row"><label for="sound-enabled">Sound</label><input id="sound-enabled" type="checkbox" role="switch" checked></div>
        <label for="volume">Volume <output id="volume-value" for="volume">38%</output></label>
        <input id="volume" type="range" min="0" max="100" value="38" aria-describedby="sound-hint">
        <p class="sr-only" id="sound-hint">Sticky sounds start with your first squeeze.</p>
        <div class="hand-settings"><button id="hands-toggle" aria-pressed="false" aria-describedby="hand-hint">Enable hand mode</button><p id="hand-hint">Camera video stays on your device. No recording or microphone.</p></div>
      </aside>
    </main>
  </div>
  <noscript><p class="error">Enable JavaScript to squish.</p></noscript>
  <script type="module" src="app.js?v=2.9.0"></script>
</body>
</html>
